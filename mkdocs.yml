site_name: Silicon Photonics — Plain-English Study Notes
site_description: Week-by-week, first-principles study notes on Chrostowski & Hochberg, Silicon Photonics Design
repo_url: https://github.com/jabezcharles420/silicon-photonics-study
repo_name: silicon-photonics-study
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
    primary: custom
    accent: amber
  font:
    text: Inter
    code: Inter
  icon:
    logo: material/lightbulb-on-outline
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - mdx_truly_sane_lists

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Week 1:
      - week-01/index.md
      - "Mon 21 Sep · Waveguide design, slab modes (§3.2.1–3.2.4)": week-01/day-01-mon-21-sep-2026.md
      - "Wed 23 Sep · Effective index method, bends (§3.2.5–3.2.6, §3.3)": week-01/day-03-wed-23-sep-2026.md
  - Week 2:
      - week-02/index.md
      - "Mon 28 Sep · Directional couplers (§4.1.1–4.1.3)": week-02/day-01-mon-28-sep-2026.md
      - "Wed 30 Sep · Mach–Zehnder, dispersion, compact models (§4.3, §3.2.9–3.2.10)": week-02/day-03-wed-30-sep-2026.md
  - Week 3:
      - week-03/index.md
      - "Mon 5 Oct · Y-branch (§4.2)": week-03/day-01-mon-5-oct-2026.md
      - "Tue 6 Oct · Fabrication variation, waveguide loss (§11.1, §3.2.11)": week-03/day-02-tue-6-oct-2026.md
      - "Wed 7 Oct · Active tuning, thermo-optic switch (§6.5–6.6, §3.1.1)": week-03/day-03-wed-7-oct-2026.md
      - "Thu 8 Oct · Plasma dispersion, pn-junction phase shifters (§6.1–6.2)": week-03/day-04-thu-8-oct-2026.md
  - Week 4:
      - week-04/index.md
      - "Wed 14 Oct · Grating couplers (§5.2)": week-04/day-03-wed-14-oct-2026.md
  - Week 5:
      - week-05/index.md
      - "Mon 19 Oct · Ring resonators, ring modulators (§4.4, §6.3)": week-05/day-01-mon-19-oct-2026.md
  - Week 6:
      - week-06/index.md
      - "Mon 26 Oct · Tapers & adiabaticity (§4.2, §5.3.1)": week-06/day-01-mon-26-oct-2026.md
  - Week 7:
      - week-07/index.md
      - "Mon 2 Nov · Grating coupler theory (§5.2.2)": week-07/day-01-mon-2-nov-2026.md
      - "Tue 3 Nov · PDK & mask layout (§10.1–10.2)": week-07/day-02-tue-3-nov-2026.md
