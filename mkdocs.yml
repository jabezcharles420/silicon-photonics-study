site_name: Silicon Photonics & Inverse Design — Plain-English Study Notes
site_description: Day-by-day, first-principles study notes on Chrostowski & Hochberg, Taflove & Hagness (FDTD) and the inverse-design research papers
repo_url: https://github.com/jabezcharles420/silicon-photonics-study
repo_name: silicon-photonics-study
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
    primary: custom
    accent: amber
  font:
    text: Inter
    code: Inter
  icon:
    logo: material/lightbulb-on-outline
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - mdx_truly_sane_lists

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Calendar: calendar.md
  - Week 1:
      - week-01/index.md
      - "Mon 21 Sep · Waveguide design, slab modes (Chrostowski §3.2.1–3.2.4)": week-01/day-01-mon-21-sep-2026.md
      - "Wed 23 Sep · Effective index method, bends (Chrostowski §3.2.5–3.2.6, §3.3)": week-01/day-03-wed-23-sep-2026.md
      - "Thu 24 Sep · Maxwell's equations & the Yee algorithm (Taflove & Hagness Ch. 3)": week-01/day-04-thu-24-sep-2026-taflove-ch3.md
      - "Thu 24 Sep · Numerical dispersion & stability (Courant) (Taflove & Hagness Ch. 4)": week-01/day-04-thu-24-sep-2026-taflove-ch4.md
  - Week 2:
